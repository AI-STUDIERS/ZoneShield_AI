name: ZoneShield AI CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pytest pytest-asyncio

      - name: Lint with Ruff
        run: |
          ruff check vision/ backend/ benchmarks/ eval/

      - name: Type check with mypy
        run: |
          mypy vision/ backend/ --ignore-missing-imports || true

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run OpenCV 5 self-check
        run: python -m zoneshield.selfcheck

      - name: Run vision tests
        run: python -m pytest vision/tests/ -v --tb=short

      - name: Run backend tests
        run: python -m pytest backend/ -v --tb=short || true

  benchmark:
    name: Benchmark (Quick)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run quick micro-benchmarks
        run: |
          python -m benchmarks.run --suite default --reps 5 --out results/
        timeout-minutes: 10

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: |
            results/results.json
            results/summary.csv
            results/BENCHMARK_REPORT.md

  evaluation:
    name: Evaluation Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run evaluation suite
        run: |
          python -m eval.run --suite default --agent mock --out reports/
        timeout-minutes: 10

      - name: Upload evaluation artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-results
          path: |
            reports/EVALUATION_REPORT.md

  build-docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t zoneshield-backend ./backend

      - name: Build worker Docker image
        run: docker build -t zoneshield-worker ./vision

      - name: Build frontend Docker image
        run: docker build -t zoneshield-frontend ./frontend

  notify:
    name: Notify on Failure
    if: failure()
    needs: [lint-and-typecheck, test, benchmark, evaluation, build-docker]
    runs-on: ubuntu-latest
    steps:
      - name: Send failure notification
        run: |
          echo "One or more CI jobs failed. Check the Actions tab for details."