[project]
name = "zoneshield-ai"
version = "0.1.0"
description = "OpenCV 5 and AWS COOL Active Conveyor Threat Interception System"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "ZoneShield AI Team", email = "zoneshield@example.org" }
]
keywords = ["opencv", "computer-vision", "aws", "graviton", "cool", "agentic-vision", "conveyor-inspection"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Hardware",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]
aws = [
    "boto3>=1.34.0",
    "botocore>=1.34.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "benchmarks*", "eval*", "infra*", "vision*", "scripts*", "docs*"]
exclude = ["tests*", "tests.*", "*.tests", "*.tests.*", "reports*", "results*", "data*"]